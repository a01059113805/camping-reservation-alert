<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캠핑장 예약 알림</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#ea580c" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px;
    line-height: 1.6;
  }
  h1 { font-size: 20px; }
  p.desc { color: #666; font-size: 14px; }
  button {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #ea580c;
    color: white;
    cursor: pointer;
    margin-top: 16px;
  }
  #copy-btn { background: #444; display: none; }
  #status { margin-top: 16px; font-size: 14px; }
  #output {
    display: none;
    margin-top: 12px;
    padding: 10px;
    background: rgba(128,128,128,0.15);
    border-radius: 8px;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
  }
  ol { font-size: 14px; color: #666; padding-left: 20px; }
</style>
</head>
<body>
  <h1>캠핑장 예약 알림</h1>
  <p class="desc">예약 확정(입금 완료) 시 이 기기로 알림을 받습니다.</p>
  <ol>
    <li>사파리 공유 버튼 → "홈 화면에 추가"</li>
    <li>홈 화면 아이콘으로 이 페이지를 다시 열기</li>
    <li>아래 "알림 켜기" 버튼 클릭 → 알림 허용</li>
    <li>표시된 값을 복사해서 GitHub Secret(PUSH_SUBSCRIPTION)에 등록 (최초 1회만)</li>
  </ol>
  <button id="enable-btn">알림 켜기</button>
  <button id="copy-btn">값 복사하기</button>
  <div id="status"></div>
  <pre id="output"></pre>
  <script src="app.js"></script>
</body>
</html>
